# this is for testing purposes only 
# to be changed later on
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendarit-deplo
  namespace: calendarit 
  labels:
    app: calendarit-app 
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: calendarit-app
  template:
    metadata:
      labels:
        app: calendarit-app
    spec:
      # cannot use that because at the beggining app creates paths
      # as root and drops into user 
      containers:
      - name: calendar-app
        image: "ghcr.io/xfilipwozniakx/calendar_it:latest"  
        imagePullPolicy: Always
        env:
        - name: JWT_SIGNING_KEY
          value: "rzBdEl1YL/5JsdSiFJKDbBCiMdchrSswsxp2rK8vUP+s02rdR2c+CyxVbn8TT/ZB"
        - name: APPDATA_PATH
          value: /var/appdata
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: files
          mountPath: "/var/appdata"
      volumes:
      - name: files
        persistentVolumeClaim:
          claimName: files-pvc

