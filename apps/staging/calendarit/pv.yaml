apiVersion: v1
kind: PersistentVolume
metadata:
  name: calendarit-pv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path-retain"
  capacity:
    storage: 3Gi
  volumeName: calendarit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calendarit-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 2.5Gi
  volumeName: calendarit
