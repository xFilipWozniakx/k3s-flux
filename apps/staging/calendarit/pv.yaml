apiVersion: v1
kind: PersistentVolume
metadata:
  name: calendarit
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2.5Gi
  storageClassName: "local-path-retain"
# could resolve into error since pv's are not namespaced and kustomization
# which will manage this resource is assigning to surten nm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calendarit-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 2.5Gi
  volumeName: calendarit
