apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendarit-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: calendar.filipwozniak.org 
      http:
        paths:
          - backend: 
              service:
                name: calendarit
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - calendar.filipwozniak.org
      secretName: calendarit-tls

