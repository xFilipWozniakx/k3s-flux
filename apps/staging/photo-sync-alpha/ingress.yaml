apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: photo-sync-ingress
spec:
  ingressClassName: traefik
  rules: 
    - host: photo-sync.filipwozniak.org 
      http:
        paths: 
          - backend: 
              service:
                name: photo-sync
                port:
                  number: 12000
            path: /
            pathType: Prefix

