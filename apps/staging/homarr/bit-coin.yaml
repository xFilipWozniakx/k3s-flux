apiVersion: v1
kind: Service
metadata:
  name: btc-api-svc
  namespace: homarr
spec:
  type: ClusterIP
  selector:
    app: bitcoin
  ports:
    - name: external
      port: 8082
      targetPort: 80
      protocol: TCP

      # not finished
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-api
  namespace: homarr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bitcoin
  template:
    metadata:
      labels:
        app: bitcoin
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: bitcoin-api
          image: ghcr.io/xfilipwozniakx/bitcoin_api:latest
          imagePullPolicy: IfNotPresent

