apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homarr-testing

resources:
  - ../../base/homarr/homarr-manifest.yaml
  - namespace.yaml
  - secret-testing.yaml
patches:
  - target:
      kind: Deployment
      name: homarr
    patch: |-
      apiVersion: v1              # api i kind jest wymagane
      kind: Deployment
      metadata:
        namespace: homarr-testing
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
            containers:
              - name: homarr
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                volumeMounts:
                  - name: homarr-db
                    mountPath: /appdata
            volumes:
              - name: homarr-db
                emptyDir: {}
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: homarr-testing
      app.kubernetes.io/instance: homarr-testing
