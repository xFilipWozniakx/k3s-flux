apiVersion: v1
kind: Pod
metadata:
  name: pod
spec:
  containers:
    image: alpine
    name: pre-build 
    command: 
      - 'tar -xzvf /app/files.tar.gz'
      - 'cp ./files/htdocs/* ./into-app'
      - 'chown 101:65532 ./into-app/*'
    volumeMount: 
      - name: binded-from-disk
        mountPath: /app 
      - name: php-app-stuff 
        mountPath: /into-app 
  volumes:
    - name: php-app-stuff 
      persistentVolumeClaim:
        claimName: php-app
    - name: binded-from-disk 
      hostPath:
        path: /home/superuser/data/
        type: Directory 
        
      
