apiVersion: v1
kind: PersistentVolume
metadata:
  name: php-app-pv
spec:
  capacity:
    storage: 5Gi
  storageClassName: local-path-retain
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /var/lib/rancher/k3s/storage/php-app-pv 
    type: DirectoryOrCreate
  claimRef:
    namespace: blog 
    name: php-app-pvc
---
apiVersion: v1 
kind: PersistentVolumeClaim
metadata:
  name: php-app-pvc
spec:
  volumeName: php-app-pv
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 5Gi
---
