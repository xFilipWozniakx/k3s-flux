apiVersion: v1
kind: PersistentVolume
metadata:
  name: php-app-pv
  labels:
    name: php-app-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1 
kind: PersistentVolumeClaim
metadata:
  name: php-app-pvc
spec:
  volumeName: php-app-pv
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 5Gi
---
