apiVersion: v1 
kind: PersistentVolumeClaim
metadata:
  name: php-app 
spec:
  accessModes:
    - ReadWriteOnce 
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1 
kind: PersistentVolumeClaim
metadata:
  name: logs-pvc
spec:
  accessModes:
    - ReadWriteOnce 
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 2.5Gi
---
apiVersion: v1 
kind: PersistentVolumeClaim
metadata:
  name: temp-db
spec:
  accessModes:
    - ReadWriteOnce 
  storageClassName: "local-path-retain"
  resources:
    requests:
      storage: 1Gi

