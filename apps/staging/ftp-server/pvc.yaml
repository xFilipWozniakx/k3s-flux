apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: data-pvc
spec:
  storageClassName: "local-path"
  accessModes: 
    - ReadWriteOnce
  resources:
      requests:
        storage: 2.5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: log-pvc
spec:
  storageClassName: "local-path"
  accessModes: 
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

