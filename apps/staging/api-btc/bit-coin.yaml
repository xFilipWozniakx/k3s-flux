apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bitcoin
  template:
    metadata:
      labels:
        app: bitcoin
    spec:
      containers:
        - name: bitcoin-api
          image: ghcr.io/xfilipwozniakx/bitcoin_api:v0.1.62
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: shared-directory
            mountPath: /api/www
          env: 
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  key: API_KEY
                  name: api-btc
                  optional: false
            - name: DNS_ADD
              valueFrom:
                secretKeyRef:
                  key: DNS_ADD
                  name: api-btc
                  optional: false

        - name: nginx
          image: nginxinc/nginx-unprivileged:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
          - name: shared-directory
            mountPath: /usr/share/nginx/html
          # - name: shared-directory
          #   mountPath: /usr/share/nginx/html 
          # - name: tmp 
          #   mountPath: /tmp
          # - name: nginx-cache
          #   mountPath: /var/cache/nginx
          # - name: nginx-run
          #   mountPath: /var/run
          ports: 
            - containerPort: 8080
      volumes:
      - name: shared-directory
        emptyDir: {}

      # - name: tmp
      #   emptyDir: {}
      # - name: nginx-cache
      #   emptyDir: {}
      # - name: nginx-run
      #   emptyDir: {}
