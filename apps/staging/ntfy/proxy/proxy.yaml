apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: proxy-ntfy
  name: proxy-ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-ntfy
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: proxy-ntfy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containers:
      - image: nginx/nginx-unprivileged:stable-trixie-perl
        name: nginx-unprivileged
        ports:
          - containerPort: 8080 
            name: proxy-port
        volumeMounts:
          - mountPath: /var/log/nginx
            name: proxy-logs-pvc
          - mountPath: /etc/nginx/conf.d/default.conf
            name: nginx-proxy-conf 
            subPath: default.conf
            readOnly: true
          - mountPath: /etc/nginx/nginx.conf 
            name: nginx-proxy-conf 
            subPath: nginx.conf 
            readOnly: true 
      volumes:
        - name: proxy-logs-pvc
          persistentVolumeClaim: 
            claimName: proxy-pvc
        - name: nginx-proxy-conf
          configMap:
            name: proxy-nginx
            items:
              - key: default.conf
                path: default.conf
              - key: nginx.conf 
                path: nginx.conf
