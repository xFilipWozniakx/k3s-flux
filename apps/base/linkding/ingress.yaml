apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: linkding-ingress
spec: 
  ingressClassName: traefik
  rules: 
    - host: ld.local 
      http:
        paths: 
          - backend: 
              service:
                name: linkding-service
                port:
                  number: 9090
            path: / 
            pathType: Prefix
