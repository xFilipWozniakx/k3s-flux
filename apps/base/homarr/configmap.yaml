apiVersion: v1
kind: ConfigMap
metadata:
  name: homarr-config
data:
  - name: ENABLE_DOCKER
    value: "false"
  - name: ENABLE_KUBERNETES
    value: "false"
  - name: AUTH_COOKIE_PREFIX
    value: "homarr"
  - name: AUTH_LDAP_GROUP_CLASS
    value: "groupOfUniqueNames"
  - name: AUTH_LDAP_GROUP_MEMBER_ATTRIBUTE
    value: "member"
  - name: AUTH_LDAP_GROUP_MEMBER_USER_ATTRIBUTE
    value: "dn"
  - name: AUTH_LDAP_SEARCH_SCOPE
    value: "base"
  - name: AUTH_LDAP_USERNAME_ATTRIBUTE
    value: "uid"
  - name: AUTH_LDAP_USER_MAIL_ATTRIBUTE
    value: "mail"
  - name: AUTH_OIDC_AUTO_LOGIN
    value: "false"
  - name: AUTH_OIDC_CLIENT_NAME
    value: "OIDC"
  - name: AUTH_OIDC_GROUPS_ATTRIBUTE
    value: "groups"
  - name: AUTH_OIDC_SCOPE_OVERWRITE
    value: "openid email profile groups"
  - name: AUTH_PROVIDERS
    value: "credentials"
  - name: AUTH_SESSION_EXPIRY_TIME
    value: "30d"
  - name: ENABLE_DNS_CACHING
    value: "false"
  - name: LOG_LEVEL
    value: "debug"
  - name: NO_EXTERNAL_CONNECTION
    value: "false"
  - name: TZ
    value: "Europe/Oslo"
  - name: DB_MIGRATIONS_DISABLED
    value: "false"
  - name: DB_DRIVER
    value: "better-sqlite3"
  - name: DB_DIALECT
    value: "sqlite"
  - name: DB_URL
    value: "/appdata/db.sqlite"
  - name: SECRET_ENCRYPTION_KEY
