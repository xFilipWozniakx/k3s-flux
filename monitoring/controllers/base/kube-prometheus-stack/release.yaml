apiVersion: helm.toolkit.fluxcd.io/v2
# HelmRelease is like a helm install 
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.x"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h

# automating process of installing new CRD's for prometheus stack
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: password
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          kubernetes.io/ingress.class: traefik
          kubernetes.io/tls-acme: "true"
        labels:
          kubernetes.io/service: grafana-ingress
        hosts:
          - grafana.filipwozniak.org
        path: /
        tls:
          - secretName: tls-grafana-secret
            hosts:
              - grafana.filipwozniak.org

        # persistence:
