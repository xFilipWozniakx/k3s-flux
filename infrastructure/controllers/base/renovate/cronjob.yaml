apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:latest
              args:
                - xfilipwozniakx/k3s-flux
              envFrom:
                - secretRef:
                    name: renovate-env-variable
                - configMapRef:
                    name: renovate-configmap
          restartPolicy: Never
