apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: '0.15.1'
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
      interval: 1h
  releaseName: arc
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment

