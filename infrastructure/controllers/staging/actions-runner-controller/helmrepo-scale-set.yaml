apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: arc
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-release
spec:
  interval: 1h
  chart:
    spec:
      version: '0.xx.x'
      sourceRef:
        kind: HelmRepository
        name: arc
        interval: 1h
  releaseName: arc-controller
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
